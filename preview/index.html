<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StackForge — Project preview</title><style>html,body{margin:0;padding:0}.sf {
  --ink: #202421;
  --muted: #5d665f;
  --line: #dfe4df;
  --paper: #f6f8f5;
  --accent: #315cdb;
  --soft-blue: #edf2ff;
  background: #fff;
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  color-scheme: light;
  isolation: isolate;
  -webkit-font-smoothing: antialiased;
}
.sf *,
.sf *::before,
.sf *::after {
  box-sizing: border-box;
}
.sf h1,
.sf h2,
.sf h3,
.sf p,
.sf ul,
.sf ol {
  margin: 0;
}
.sf a {
  color: inherit;
  text-decoration: none;
}
.sf button,
.sf input,
.sf select {
  font: inherit;
}
.sf button,
.sf select {
  cursor: pointer;
}
.sf button {
  color: inherit;
}
.sf svg {
  flex-shrink: 0;
}
.sf button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.sf :focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 4px;
}
.sf ::selection {
  background: #dfe9ff;
  color: #18233e;
}
.sf [id] {
  scroll-margin-top: 100px;
}
.sf [hidden] {
  display: none !important;
}
.sf-shell {
  width: min(1184px, 100%);
  padding-inline: 32px;
  margin-inline: auto;
}
.sf-section {
  padding-block: 88px;
}
.sf-skip {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 100;
  transform: translateY(-180%);
  padding: 12px 20px;
  background: var(--ink);
  color: #fff !important;
  border-radius: 8px;
}
.sf-skip:focus {
  transform: translateY(0);
}
.sf-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.97);
  border-bottom: 1px solid var(--line);
}
.sf-header-inner {
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.sf-brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 750;
  font-size: 20px;
  letter-spacing: -0.7px;
  white-space: nowrap;
  min-height: 44px;
}
.sf-mark {
  display: grid;
  place-items: center;
  background: var(--ink);
  color: white;
  width: 34px;
  height: 34px;
  border-radius: 9px;
}
.sf-alpha {
  font:
    14px/1 Arial,
    sans-serif;
  letter-spacing: 0.8px;
  color: var(--muted);
  border-left: 1px solid var(--line);
  padding-left: 10px;
  margin-left: 2px;
}
.sf-desktop-nav {
  display: flex;
  gap: 24px;
}
.sf-desktop-nav a {
  font-size: 14px;
  color: var(--muted);
  padding-block: 12px;
}
.sf-desktop-nav a:hover,
.sf-text-link:hover {
  color: var(--accent);
}
.sf-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 48px;
  padding: 12px 20px;
  border: 1px solid var(--ink);
  border-radius: 8px;
  background: var(--ink);
  color: #fff !important;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  transition:
    background 0.15s,
    border-color 0.15s;
}
.sf-button:hover {
  background: #37433a;
  border-color: #37433a;
}
.sf-button-small {
  min-height: 44px;
  padding: 10px 16px;
}
.sf-button-secondary {
  background: white;
  color: var(--ink) !important;
  border-color: var(--line);
}
.sf-button-secondary:hover {
  background: var(--paper);
  border-color: #86958a;
}
.sf-text-link {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  font-weight: 600;
  min-height: 44px;
}
.sf-menu-button {

  gap: 12px;
  background: none;
  border: 1px solid var(--line);

}
.sf-mobile-nav {
  padding: 8px 24px 20px;
  border-top: 1px solid var(--line);
}
.sf-mobile-nav a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  min-height: 48px;
}
.sf-eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  font:
    600 14px/1.6 Arial,
    sans-serif;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin-bottom: 20px !important;
}
.sf-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}
.sf-hero {
  padding-top: 72px;
  padding-bottom: 48px;
  display: grid;
  grid-template-columns: 1fr 220px;
  gap: 64px;
  align-items: end;
}
.sf h1 {
  font-size: clamp(38px, 4.5vw, 60px);
  font-weight: 650;
  line-height: 1.07;
  letter-spacing: -2.9px;
}
.sf h1 span {
  color: #747e75;
}
.sf-lead {

.sf-actions {

}

}
.sf-hero-note {

}

}
.sf-hero-note p {

  margin-block: 18px 12px;
}
.sf-hero-note > span:last-of-type {

}
.sf-hero-note a {

  border: 1px solid var(--line);

}
.sf-preview-section {
  padding-bottom: 56px;
}
.sf-preview {
  border: 1px solid #ccd5cd;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 24px #263a2510;
}
.sf-preview-toolbar {
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 1px solid var(--line);
  background: #fafbf9;
  font-size: 14px;
}
.sf-preview-project {
  display: flex;
  align-items: center;
  gap: 10px;
}
.sf-project-icon {
  font-size: 24px;
  color: #677c6e;
}
.sf-muted {
  color: var(--muted);
}
.sf-status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 14px;
  line-height: 1.5;
  border: 1px solid #cbd7e9;
  background: #f1f5fd;
  color: #385174;
  border-radius: 4px;
  padding: 4px 8px;
  white-space: nowrap;
}
.sf-preview-body {
  display: grid;
  grid-template-columns: 208px minmax(0, 1fr);
}
.sf-library {
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
}
.sf-field-label,
.sf-library-caption {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--muted);
}
.sf-library select {
  width: 100%;
  margin-top: 10px;
  border: 1px solid #aeb9af;
  border-radius: 6px;
  background: white;
  padding: 10px 6px;
  font-size: 14px;
  min-height: 44px;
  color: var(--ink);
}
.sf-library-caption {
  margin-top: 24px !important;
}
.sf-block-list {
  list-style: none;
  padding: 8px 0 !important;
  display: grid;
  gap: 8px;
}
.sf-block-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  padding: 6px;
}
.sf-block-symbol {
  width: 28px;
  height: 28px;
  border-radius: 6px;

  place-items: center;
  flex-shrink: 0;
  font-size: 18px;
  line-height: 1;
}
.sf-blue {
  background: #edf2ff;
  color: #335dcc;
}
.sf-amber {
  background: #fff3db;
  color: #886000;
}
.sf-green {
  background: #e9f3eb;
  color: #316d44;
}
.sf-library-foot {
  font-size: 14px;
  line-height: 1.6;
  color: var(--muted);
  margin-top: auto !important;
  padding-top: 24px;
}
.sf-library-foot strong {
  font-weight: 500;
  color: var(--ink);
}
.sf-workspace {
  min-width: 0;
}
.sf-workspace-toolbar {
  min-height: 64px;

  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.sf-view-switch {
  display: flex;
  border: 1px solid var(--line);

}

  border: 0;

  border-radius: 4px;
  min-height: 40px;
  padding: 8px 12px;
  font-size: 14px;
  color: var(--muted);
}
.sf-view-switch button[aria-pressed="true"] {
  background: #e9eeea;
  color: var(--ink);
  font-weight: 600;
}
.sf-canvas {
  background-color: #f7f9f6;
  background-image: radial-gradient(#cad5cb 0.8px, transparent 0.8px);
  background-size: 18px 18px;
  padding: 28px 24px 20px;
  min-height: 265px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.sf-canvas-label {
  font: 14px/1.5 monospace;
  letter-spacing: 1.2px;

}
.sf-flow {

}

  padding: 12px;
}
.sf-node:not(:last-child)::after {
  content: "→";
  position: absolute;
  width: 28px;
  right: -29px;
  top: 50%;
  text-align: center;
  transform: translateY(-50%);
  color: #778d7d;
  font-size: 20px;
}
.sf-node-top {
  display: flex;
  align-items: center;

}
.sf-node-index {
  margin-left: auto;
  color: #6c7e70;
}
.sf-node strong {
  display: block;
  font-size: 14px;
  line-height: 1.45;
  margin-top: 14px;
}
.sf-node-bottom {
  display: block;
  font-size: 14px;
  color: var(--muted);
  margin-top: 6px;
}
.sf-canvas-caption {
  font-size: 14px;
  color: #5d6b61;
}
.sf-code-pane {
  background: #19231e;
  color: #e2f0e4;
  height: 265px;
  overflow: auto;
  padding: 16px 24px;
}
.sf-code-caption {
  font: 14px/1.5 monospace;
  color: #bed0c4;
  margin-bottom: 12px !important;
}
.sf-code-pane pre {
  font:
    14px/1.6 Consolas,
    monospace;
  margin: 0;
  white-space: pre;
  min-width: 0;
}
.sf-parameter {
  padding: 16px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.sf-parameter label {
  font-size: 14px;
  font-weight: 600;
}
.sf-parameter p {
  font-size: 14px;
  color: var(--muted);
}
.sf-range-wrap {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 48%;
}
.sf-range-wrap input {

}

  font: 14px/1.5 monospace;

}
.sf-preview-footer {

.sf-preview-footer > span:last-child {

}

}
.sf-preview-description h2 {

  letter-spacing: -0.4px !important;
}
.sf-preview-description p {
  font-size: 14px;
  color: var(--muted);
}
.sf-games {
  border-block: 1px solid var(--line);
  background: #fafbf9;
}
.sf-games-inner {
  display: flex;

  justify-content: space-between;
  gap: 40px;
  padding-block: 32px;
}
.sf-games .sf-eyebrow {
  margin-bottom: 4px !important;

}
.sf-games p {
  font-size: 14px;

}
.sf-games ul {
  display: flex;
  list-style: none;

}
.sf-games li {
  display: flex;

}
.sf-games strong {

}
.sf-games li span {

}
.sf h2 {
  font-size: 38px;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -1.5px;
}

}

}

}

}
.sf-step-number {

}
.sf-principles .sf-text-link {

}
.sf-principle-list {

}
.sf-principle-list article {

}
.sf-principle-list article:last-child {

  color: var(--ink);
}
.sf-email-row .sf-button {
  flex: 1 1 auto;
}
.sf-consent {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-top: 16px;
}
.sf-consent input {
  margin: 0;
  width: 22px;
  height: 44px;
  flex-shrink: 0;
  accent-color: var(--accent);
}
.sf-consent label {
  font-size: 14px;
  min-height: 44px;
  cursor: pointer;
}
.sf-consent a {
  text-decoration: underline;
}
.sf-form-message {
  font-size: 14px;
  color: #465877;
  margin-top: 12px !important;
  min-height: 40px;
}
.sf-form-error {
  color: #a02d28;
}
.sf-faq {
  padding-top: 0;
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 64px;
}
.sf-faq-list {
  border-top: 1px solid var(--line);
}
.sf-faq details {
  border-bottom: 1px solid var(--line);
}
.sf-faq summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 20px 0;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
  min-height: 64px;
}
.sf-faq summary::-webkit-details-marker {
  display: none;
}
.sf-faq summary > span {
  font-size: 22px;
  font-weight: 400;
  flex-shrink: 0;
}
.sf-faq details[open] summary > span {
  transform: rotate(45deg);
}
.sf-faq details > p {
  padding: 0 28px 24px 0;
  font-size: 14px;
  color: var(--muted);
}
.sf-footer {
  border-top: 1px solid var(--line);
  padding-block: 32px;
  background: #fafbf9;
}
.sf-footer > .sf-shell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
.sf-footer p {
  font-size: 14px;
  color: var(--muted);
}
.sf-footer a:not(.sf-brand) {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  min-height: 44px;
}
.sf-footer-bottom {
  border-top: 1px solid var(--line);
  margin-top: 24px;
  padding-top: 20px;
  font-size: 14px;
  color: var(--muted);
}
@media (min-width: 900px) {
  .sf-mobile-nav {
    display: none !important;
  }
}
@media (max-width: 1100px) {
  .sf-alpha {
    display: none;
  }
  .sf-desktop-nav {
    gap: 20px;
  }
  .sf-hero {
    gap: 40px;
    grid-template-columns: 1fr 180px;
  }
  .sf h1 {
    font-size: 50px;
  }
  .sf-flow {
    gap: 20px;
  }
  .sf-node:not(:last-child)::after {
    width: 20px;
    right: -21px;
  }
  .sf-node {
    padding: 10px;
  }
  .sf-node-index {
    display: none;
  }
  .sf-games ul {
    gap: 32px;
  }
  .sf-plan {
    padding: 20px 16px;
  }
  .sf-plan-label {
    font-size: 14px;
  }
  .sf-principles-inner {
    gap: 56px;
  }
}
@media (max-width: 899px) {
  .sf-shell {
    padding-inline: 24px;
  }
  .sf-desktop-nav,
  .sf-header-cta {
    display: none;
  }
  .sf-menu-button {
    display: flex;
  }
  .sf-header-inner {
    height: 68px;
  }
  .sf-hero {
    grid-template-columns: 1fr;
    padding-top: 48px;
    gap: 0;
  }
  .sf-hero-note {
    display: none;
  }
  .sf h1 {
    font-size: 52px;
  }
  .sf-preview-body {
    grid-template-columns: 168px minmax(0, 1fr);
  }
  .sf-library {
    padding: 20px 12px;
  }
  .sf-workspace-toolbar {
    flex-wrap: wrap;
    gap: 8px;
    padding-inline: 16px;
  }
  .sf-canvas {
    padding: 20px 16px;
  }
  .sf-flow {
    gap: 12px;
  }
  .sf-node:not(:last-child)::after {
    width: 12px;
    right: -13px;
    font-size: 14px;
  }
  .sf-node-top {
    font-size: 14px;
    gap: 4px;
  }
  .sf-node .sf-block-symbol {
    width: 22px;
    height: 22px;
    font-size: 14px;
  }
  .sf-node strong {
    font-size: 14px;
  }
  .sf-preview-footer > span:last-child {
    display: none;
  }
  .sf-games-inner {
    align-items: flex-start;
    flex-direction: column;
    gap: 24px;
  }
  .sf-games ul {
    width: 100%;
    justify-content: space-between;
  }
  .sf-section {
    padding-block: 64px;
  }
  .sf-plans {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
  }
  .sf-plan-label {
    font-size: 14px;
  }
  .sf-plan-description {
    min-height: 0;
  }
  .sf-plan {
    padding: 24px;
  }
  .sf-principles-inner {
    gap: 40px;
  }
  .sf-access {
    padding: 32px;
    gap: 32px;
  }
  .sf-faq {
    padding-top: 0;
    gap: 32px;
  }
  .sf-timeline {
    gap: 24px;
  }
  .sf-section-heading {
    gap: 32px;
  }
  .sf-section-heading > p {
    max-width: 300px;
  }
  .sf h2 {
    font-size: 32px;
  }
  .sf-principles h2 {
    font-size: 34px;
  }
}
@media (max-width: 620px) {
  .sf-shell {
    padding-inline: 20px;
  }
  .sf-hero {
    padding-block: 40px 32px;
  }
  .sf h1 {
    font-size: 39px;
    letter-spacing: -1.8px;
  }
  .sf-lead {
    font-size: 16px;
  }
  .sf-eyebrow {
    font-size: 14px;
    margin-bottom: 16px !important;
  }
  .sf-actions {
    gap: 16px;
    margin-top: 24px;
  }
  .sf-note {
    font-size: 14px;
  }
  .sf-preview-toolbar {
    padding: 12px;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 8px;
  }
  .sf-preview-project {
    font-size: 14px;
  }
  .sf-preview-project .sf-muted {
    display: none;
  }
  .sf-status {
    font-size: 14px;
  }
  .sf-preview-body {
    grid-template-columns: 1fr;
  }
  .sf-library {
    padding: 16px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .sf-library select {
    margin-top: 8px;
  }
  .sf-library-caption,
  .sf-block-list,
  .sf-library-foot {
    display: none !important;
  }
  .sf-workspace-toolbar {
    padding: 8px 12px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .sf-workspace-toolbar > .sf-muted {
    display: none;
  }
  .sf-workspace-toolbar > span {
    font-size: 14px;
  }
  .sf-view-switch button {
    min-height: 44px;
    font-size: 14px;
    padding-inline: 10px;
  }
  .sf-canvas {
    padding: 20px;
    min-height: auto;
  }
  .sf-flow {
    flex-direction: column;
    gap: 24px;
    padding-block: 20px !important;
  }
  .sf-node {
    padding: 12px 16px;
  }
  .sf-node-top {
    font-size: 14px;
    gap: 8px;
  }
  .sf-node .sf-block-symbol {
    width: 26px;
    height: 26px;
    font-size: 16px;
  }
  .sf-node-index {
    display: block;
  }
  .sf-node strong {
    font-size: 14px;
    margin-top: 10px;
  }
  .sf-node-bottom {
    font-size: 14px;
  }
  .sf-node:not(:last-child)::after {
    content: "↓";
    top: auto;
    bottom: -25px;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: 20px;
    height: 24px;
    font-size: 20px;
  }
  .sf-canvas-caption {
    font-size: 14px;
  }
  .sf-canvas-label {
    font-size: 14px;
  }
  .sf-parameter {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 16px;
  }
  .sf-range-wrap {
    width: 100%;
  }
  .sf-preview-footer {
    font-size: 14px;
    padding: 12px 16px;
  }
  .sf-preview-description {
    grid-template-columns: 1fr;
    gap: 8px;
    padding-top: 20px;
  }
  .sf-preview-section {
    padding-bottom: 32px;
  }
  .sf-games-inner {
    padding-block: 24px;
  }
  .sf-games ul {
    gap: 16px;
    flex-wrap: wrap;
  }
  .sf-games strong {
    font-size: 17px;
  }
  .sf-games li span {
    font-size: 14px;
  }
  .sf-section {
    padding-block: 48px;
  }
  .sf-section-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 32px;
  }
  .sf-section-heading > p {
    max-width: none;
  }
  .sf h2 {
    font-size: 32px;
  }
  .sf-steps {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .sf-steps h3 {
    margin-top: 12px;
  }
  .sf-steps article {
    padding-top: 20px;
  }
  .sf-principles-inner {
    grid-template-columns: 1fr;
    padding-block: 40px;
    gap: 32px;
  }
  .sf-principles h2 {
    font-size: 34px;
  }
  .sf-plans {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .sf-plan {
    padding: 24px;
  }
  .sf-plan-description {
    min-height: 0;
  }
  .sf-pricing-notes {
    grid-template-columns: 1fr;
    gap: 12px;
    font-size: 14px;
  }
  .sf-timeline {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .sf-timeline li {
    display: flex;
    gap: 16px;
    padding-top: 24px;
  }
  .sf-phase {
    flex-shrink: 0;
    margin-bottom: 0;
  }
  .sf-access {
    grid-template-columns: 1fr;
    padding: 24px;
    gap: 32px;
  }
  .sf-faq {
    padding-top: 0;
    grid-template-columns: 1fr;
    gap: 24px;
  }
  .sf-faq summary {
    font-size: 14px;
  }
  .sf-footer > .sf-shell {
    flex-wrap: wrap;
    gap: 16px;
  }
  .sf-footer p {
    font-size: 14px;
  }
  .sf-footer-bottom {
    font-size: 14px;
    gap: 8px !important;
  }
  .sf-code-pane {
    height: 400px;
    padding: 16px;
  }
  .sf-code-pane pre {
    font-size: 14px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .sf *,
  .sf *::before,
  .sf *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

.sf-export-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding: 20px;
  border-top: 1px solid var(--line);
}
.sf-export-row strong {
  font-size: 14px;
}
.sf-export-row p {
  font-size: 14px;
  color: var(--muted);
}
.sf-export-message {
  font-size: 14px;
  color: var(--muted);
  padding-inline: 20px;
}
.sf-export-message:not(:empty) {
  padding-bottom: 16px;
}
@media (max-width: 620px) {
  .sf-export-row {
    align-items: stretch;
    flex-direction: column;
    gap: 16px;
  }
}
